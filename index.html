<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portal web con juegos HTML5 originales y proyectos open source." />
  <title>Web Lab 123</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">WEB LAB 123</a>
    <input id="search" class="search" type="search" placeholder="Buscar juegos..." aria-label="Buscar juegos" />
  </header>

  <main class="page">
    <section class="hero">
      <p class="eyebrow">JUEGA SIN SALIR DE LA PÁGINA</p>
      <h1>Tu portal de juegos HTML5</h1>
      <p>Juegos propios y proyectos open source que se abren dentro del reproductor del sitio.</p>
    </section>

    <section>
      <div class="section-head">
        <h2>Juegos</h2>
        <span id="count">6 juegos</span>
      </div>

      <div id="games" class="grid">
        <button class="game-card" data-title="Meteor Dodge" data-url="games/meteor-dodge/index.html">
          <div class="game-art meteor-art">☄</div>
          <div class="game-info">
            <strong>Meteor Dodge</strong>
            <span>Original</span>
          </div>
        </button>

        <button class="game-card" data-title="2048" data-url="https://gabrielecirulli.github.io/2048/">
          <div class="game-art number-art">2048</div>
          <div class="game-info">
            <strong>2048</strong>
            <span>Open source · MIT</span>
          </div>
        </button>

        <button class="game-card" data-title="Hextris" data-url="https://hextris.github.io/hextris/">
          <div class="game-art hex-art">⬡</div>
          <div class="game-info">
            <strong>Hextris</strong>
            <span>Open source · GPLv3</span>
          </div>
        </button>

        <button class="game-card" data-title="Snake" data-url="https://vis-a11y.github.io/snake-game/">
          <div class="game-art snake-art">S</div>
          <div class="game-info">
            <strong>Snake</strong>
            <span>Open source · MIT</span>
          </div>
        </button>

        <button class="game-card" data-title="Asteroids" data-url="https://7affer.github.io/asteroids-html5/">
          <div class="game-art asteroid-art">✦</div>
          <div class="game-info">
            <strong>Asteroids</strong>
            <span>Open source · MIT</span>
          </div>
        </button>

        <button class="game-card" data-title="Breakout" data-url="https://akshatjain02.github.io/">
          <div class="game-art breakout-art">▦</div>
          <div class="game-info">
            <strong>Breakout</strong>
            <span>Open source · MIT</span>
          </div>
        </button>
      </div>

      <p id="empty" class="empty" hidden>No encontré juegos con ese nombre.</p>
    </section>
  </main>

  <section id="player" class="player" hidden aria-label="Reproductor de juego">
    <div class="player-bar">
      <strong id="player-title">Juego</strong>
      <button id="close-player" type="button">Cerrar</button>
    </div>
    <iframe
      id="game-frame"
      title="Juego"
      allow="autoplay; fullscreen; gamepad"
      referrerpolicy="no-referrer"
    ></iframe>
  </section>

  <script src="app.js"></script>
</body>
</html>
